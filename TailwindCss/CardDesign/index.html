<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="h-[330px] w-[800px] rounded-sm border border-gray-500 m-auto justify-center">
     <div class="h-[100px] w-[800px] rounded-sm  m-auto bg-sky-300 flex items-center justify-center">
         <h1 class="text-3xl text-white">News you can Trust</h1>
    </div>
    <div class="h-[200px] w-[800px]">
        <div class="heading w-[800px] h-[80px] text-center pt-4">
            <h3 class="font-bold text-lg">Stay up to date with the Latest!</h3>
            <p>Subscribe to our newslettler for the latest news straight into your inbox</p>
        </div>
        <div class="heading w-[800px] h-[100px] text-center pt-4">
            <input type="text" placeholder="you@example.com" class="bg-stone-100 rounded-sm w-[200px] text-center h-[30px]">
            <br>
            <button class="bg-sky-300 rounded-3xl w-[200px] mt-2 pt-1 pb-1">Subscribe Now</button>
        </div>
         <div class="heading w-[800px] h-[49px] pt-4  text-center">
            <h2>We value your privacy</h2>
        </div>
        
    </div>
    </div>
</body>
</html>
